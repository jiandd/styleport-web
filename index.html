<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StylePort Web</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:dark}body{margin:0;background:#0c101b;color:#f5f7ff}main{max-width:760px;margin:6vh auto;padding:22px}h1{font-size:40px;margin-bottom:8px}p{color:#aebad3;line-height:1.7}.panel{border:1px solid #2b3856;border-radius:22px;background:#161e31;padding:26px;margin-top:25px}input{width:100%;margin:12px 0}button,.download{border:0;border-radius:12px;background:#739cff;color:#081327;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;margin:6px 6px 6px 0}button:disabled{opacity:.5}li{padding:8px 0;overflow-wrap:anywhere}small{color:#b5c2d9}.warn{color:#ffd39a}#status{white-space:pre-wrap}</style></head><body><main><h1>StylePort <span style="color:#739cff">Web</span></h1><p>在浏览器本地将兼容的摄影风格 2 HEIC 转换为摄影风格 3。文件不会上传服务器。</p><div class="panel"><h2>选择 HEIC 照片</h2><input id="files" type="file" accept=".heic,.heif,image/heic,image/heif" multiple><button id="go">开始转换</button><p id="status">请选择照片。</p><ul id="results"></ul></div><p class="warn">实验性移植：仅处理独立 HEIC 静态照片；Live Photo、系统照片图库写入、浏览器兼容性尚未验证。请保留原图，并在 iPhone 照片 App 中确认转换结果。</p><small>依据 StylePort 开源项目移植 · Apache-2.0 · 非 Apple 官方工具</small></main><script type="module">
import {convert,template} from './heic.js';
const $=id=>document.getElementById(id),go=$('go'),status=$('status'),list=$('results');
go.onclick=async()=>{const fs=[...$('files').files];if(!fs.length)return status.textContent='请先选择照片';go.disabled=true;list.replaceChildren();let ok=0;try{const r=await fetch('./Styles3Template.bin');if(!r.ok)throw Error('无法加载 Styles3Template.bin');const t=template(new Uint8Array(await r.arrayBuffer()));for(const f of fs){const li=document.createElement('li');list.append(li);try{const result=convert(new Uint8Array(await f.arrayBuffer()),t);if(result.already){li.textContent=f.name+'：已含目标风格数据，跳过';continue}const blob=new Blob([result.data],{type:'image/heic'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.className='download';a.href=url;a.download=f.name.replace(/\.(heic|heif)$/i,'')+'_GP.HEIC';a.textContent='下载 '+a.download;li.append(a);ok++}catch(e){li.textContent=f.name+'：'+e.message}}status.textContent=`处理完成：${ok} 个文件生成下载链接。请逐个保存并验证。`}catch(e){status.textContent='初始化失败：'+e.message}finally{go.disabled=false}};
</script></body></html>
